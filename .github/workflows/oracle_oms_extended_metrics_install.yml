name: Oracle OMS Extended Metrics Install

on:
  push:
    branches:
      - DBA-1253
  workflow_dispatch:
    inputs:
      TargetOMS:
        description: 'Target OMS for Installation of Extended Metrics'
        default: ''
        type: choice
        options:
          - 'hmpps_oem_development                      EMREP'
          - 'hmpps_oem_test                             EMREP'
          - 'hmpps_oem_preproduction                    EMREP'
          - 'hmpps_oem_production                       EMREP'
      SourceConfigVersion:
        description: 'Branch/tag/commit for modernisation-platform-configuration-management'
        type: string
        default: 'main'

permissions:
  contents: read
  packages: read
  id-token: write

env:
  ansible_config: inventory/ansible/ansible.cfg
  inventory: inventory/ansible

jobs:
  deployment:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ministryofjustice/hmpps-delius-operational-automation:0.80.0
    timeout-minutes: 1440
    continue-on-error: false
    steps:

      - name: Checkout Local Repo to get Composite Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Primary Database Access
        id: setup_db_system_access
        uses: ./.github/actions/setup_oracle_target_access
        with:
          TargetEntities: "${{ github.event.inputs.TargetOMS }}"
          TargetEntitiesType: "primary"
          SourceConfigVersion: "${{ github.event.inputs.SourceConfigVersion }}"
          ModernisationPlatformEnvironmentManagement: "${{ secrets.MODERNISATION_PLATFORM_ENVIRONMENT_MANAGEMENT }}"

      - name: Fetch Required Roles & Site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ministryofjustice/modernisation-platform-configuration-management
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ansible/roles/oracle-oms-setup
            ansible/roles/get-ec2-facts
            ansible/roles/secretsmanager-passwords
            ansible/roles/get-modernisation-platform-facts
            ansible/roles/oracle-oem-blackout
            ansible/roles/oracle-oem-agent-setup
            ansible/site.yml
          path: roles
          ref: ${{ github.event.inputs.SourceConfigVersion }}
          fetch-depth: 0

      - name: Install OEM Extended Metrics
        id: install_oem_extended_metrics
        run: |
              # Enable Ansible Task Profiling
              export ANSIBLE_CALLBACKS_ENABLED="ansible.posix.profile_tasks"
              ansible-playbook \
                 -i $inventory \
                 --extra-vars "target=environment_name_${{ github.event.inputs.TargetOMS }}" \
                 --extra-vars force_role=oracle-oms-setup roles/ansible/site.yml \
                 --tags=import_metric_extensions 